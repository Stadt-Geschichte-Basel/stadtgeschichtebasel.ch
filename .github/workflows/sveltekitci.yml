name: SvelteKit CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch: null
  repository_dispatch:

permissions: {}

jobs:
  sveltekitci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The pnpm store is cached below, after pnpm is installed
          package-manager-cache: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # The pnpm version comes from packageManager in package.json
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: '${{ env.STORE_PATH }}'
          key: "${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}"
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install
      - name: Install playwright
        run: pnpm exec playwright install --with-deps
      - name: Lint
        run: pnpm run lint
      - name: Unit tests
        run: pnpm run test:unit --run
      - name: Setup jampack cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .jampack
          key: jampack
          restore-keys: |
            jampack
      - name: Build
        run: pnpm run build
      - name: Audit build
        run: pnpm run --silent audit:build --strict >> "$GITHUB_STEP_SUMMARY"
      - name: Test
        run: pnpm run test
      # cloudflare/pages-action no longer exists. wrangler-action is its official successor.
      - name: Publish to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Stadt-Geschichte-Basel/stadtgeschichtebasel.ch'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          accountId: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          wranglerVersion: '4.145.0'
          command: pages deploy build --project-name=stadtgeschichtebasel-ch --branch=main
